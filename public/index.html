<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Ober Artisan Drums</title>

    <!-- Stripe (safe to include globally) -->
    <script src="https://js.stripe.com/v3/" defer></script>

    <!-- Font Awesome (replace KIT_ID if you use it; otherwise remove this line) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css"
    />

    <!-- Preload the first carousel image to avoid layout pop -->
    <link rel="preload" as="image" href="/carousel/artisan-drums.webp" />

    <style>
      body {
        background: #eceff1;
        color: rgba(0, 0, 0, 0.87);
        font-family: Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      #root { isolation: isolate; }
      #message {
        background: #fff;
        max-width: 360px;
        margin: 100px auto 16px;
        padding: 32px 24px;
        border-radius: 3px;
      }
      #message h1, #message h2, #message p {
        margin: 0 0 16px;
        font-size: 14px;
      }
      #load {
        color: rgba(0, 0, 0, 0.4);
        text-align: center;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- CRA/Vite will inject your app bundle(s) -->
  </body>
</html>
